<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frog Horde</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0f0a; font-family: system-ui, sans-serif; }
  canvas { display: block; }
  #overlay {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px;
    background: rgba(5, 10, 5, 0.75); color: #cfe8b0; cursor: pointer; text-align: center;
  }
  #overlay h1 { margin: 0; font-size: 56px; letter-spacing: 4px; color: #8fdc4a; text-shadow: 0 0 18px #3f8f1a; }
  #overlay p { margin: 0; opacity: 0.85; }
  #overlay.hidden { display: none; }
  #crosshair {
    position: fixed; left: 50%; top: 50%; width: 22px; height: 22px;
    transform: translate(-50%, -50%); pointer-events: none;
  }
  #crosshair::before, #crosshair::after {
    content: ''; position: absolute; background: #d8ffb0; box-shadow: 0 0 3px #000;
  }
  #crosshair::before { left: 10px; top: 0; width: 2px; height: 22px; }
  #crosshair::after  { top: 10px; left: 0; height: 2px; width: 22px; }
  #ammo {
    position: fixed; right: 24px; bottom: 20px; color: #d8ffb0; font-size: 28px; font-weight: 700;
    text-shadow: 0 0 6px #000; pointer-events: none; font-variant-numeric: tabular-nums;
  }
  #ammo.low { color: #ff7a5a; }
  /* HUD is hidden while the title/pause/game-over overlay is shown */
  #overlay:not(.hidden) ~ #hud { display: none; }
  #hud { position: fixed; inset: 0; pointer-events: none; color: #d8ffb0; text-shadow: 0 0 6px #000; }
  #health { position: absolute; left: 24px; bottom: 24px; width: 220px; }
  #health-label { font-size: 14px; font-weight: 700; margin-bottom: 4px; }
  #health-bar { height: 14px; background: rgba(0,0,0,0.5); border: 1px solid #9fcf70; border-radius: 3px; overflow: hidden; }
  #health-fill { height: 100%; width: 100%; background: #8fdc4a; transition: width 0.15s; }
  #health-fill.low { background: #ff5a3a; }
  #stats { position: absolute; left: 24px; top: 18px; font-size: 18px; font-weight: 700; line-height: 1.5; }
  #hint {
    position: absolute; left: 50%; bottom: 70px; transform: translateX(-50%); padding: 8px 14px;
    background: rgba(0,0,0,0.6); border-radius: 6px; font-size: 15px; opacity: 0; transition: opacity 0.5s;
  }
  #hint.show { opacity: 1; }
  #banner {
    position: absolute; left: 50%; top: 28%; transform: translateX(-50%); font-size: 48px; font-weight: 800;
    letter-spacing: 4px; color: #8fdc4a; opacity: 0; transition: opacity 0.4s; white-space: nowrap;
  }
  #banner.show { opacity: 1; }
  #banner small { display: block; font-size: 18px; letter-spacing: 1px; text-align: center; color: #cfe8b0; }
  #hurt { position: absolute; inset: 0; box-shadow: inset 0 0 160px 40px rgba(200, 0, 0, 0.8); opacity: 0; }
</style>
</head>
<body>
<div id="overlay">
  <h1 id="title">FROG HORDE</h1>
  <p id="subtitle">Click to play</p>
  <p id="controls-hint">WASD move · Mouse look · Space jump · Shift sprint · Esc pause</p>
  <p>Left click shoot (hold for auto) · R reload · M mute</p>
</div>
<div id="hud">
  <div id="hurt"></div>
  <div id="crosshair"></div>
  <div id="ammo">30 / 30</div>
  <div id="stats">WAVE <span id="wave">1</span><br>SCORE <span id="score">0</span><br>FROGS LEFT <span id="left">0</span></div>
  <div id="health"><div id="health-label">HEALTH <span id="hp">100</span></div>
    <div id="health-bar"><div id="health-fill"></div></div></div>
  <div id="banner"></div>
  <div id="hint">Mouse lock isn't available here: drag the mouse to look, hold the left button to shoot</div>
</div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

// ---------- Renderer / scene ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2a3a24);
scene.fog = new THREE.Fog(0x2a3a24, 25, 85);

const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 200);

// ---------- Lighting ----------
scene.add(new THREE.HemisphereLight(0xbfe0a0, 0x304a26, 1.4));
const moon = new THREE.DirectionalLight(0xe8f8d0, 2.0);
moon.position.set(20, 40, 10);
moon.castShadow = true;
moon.shadow.mapSize.set(2048, 2048);
Object.assign(moon.shadow.camera, { left: -45, right: 45, top: 45, bottom: -45 });
scene.add(moon);

// ---------- Arena ----------
const ARENA = 40; // half-size
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(ARENA * 2, ARENA * 2),
  new THREE.MeshStandardMaterial({ color: 0x3a4a2a, roughness: 1 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// Swampy puddles
const puddleMat = new THREE.MeshStandardMaterial({ color: 0x1f3a2a, roughness: 0.2, metalness: 0.3 });
for (let i = 0; i < 14; i++) {
  const p = new THREE.Mesh(new THREE.CircleGeometry(1 + Math.random() * 2.5, 20), puddleMat);
  p.rotation.x = -Math.PI / 2;
  p.position.set((Math.random() - 0.5) * ARENA * 1.7, 0.01, (Math.random() - 0.5) * ARENA * 1.7);
  scene.add(p);
}

// Walls
const wallMat = new THREE.MeshStandardMaterial({ color: 0x4b3d2c, roughness: 0.9 });
const WALL_H = 4;
[[0, -ARENA, ARENA * 2, 1], [0, ARENA, ARENA * 2, 1], [-ARENA, 0, 1, ARENA * 2], [ARENA, 0, 1, ARENA * 2]]
  .forEach(([x, z, w, d]) => {
    const wall = new THREE.Mesh(new THREE.BoxGeometry(w, WALL_H, d), wallMat);
    wall.position.set(x, WALL_H / 2, z);
    wall.castShadow = wall.receiveShadow = true;
    scene.add(wall);
  });

// Crates as cover (also block the player)
const obstacles = []; // {minX,maxX,minZ,maxZ}
const crateMat = new THREE.MeshStandardMaterial({ color: 0x6b5233, roughness: 0.8 });
for (let i = 0; i < 12; i++) {
  const s = 1.5 + Math.random() * 1.5;
  const x = (Math.random() - 0.5) * ARENA * 1.6;
  const z = (Math.random() - 0.5) * ARENA * 1.6;
  if (Math.hypot(x, z) < 6) continue; // keep spawn clear
  const crate = new THREE.Mesh(new THREE.BoxGeometry(s, s, s), crateMat);
  crate.position.set(x, s / 2, z);
  crate.castShadow = crate.receiveShadow = true;
  scene.add(crate);
  obstacles.push({ minX: x - s / 2, maxX: x + s / 2, minZ: z - s / 2, maxZ: z + s / 2 });
}

// ---------- Player controls ----------
const controls = new PointerLockControls(camera, document.body);
scene.add(controls.getObject());
const EYE = 1.7, RADIUS = 0.4;
camera.position.set(0, EYE, 0);

const overlay = document.getElementById('overlay');
controls.addEventListener('lock', () => overlay.classList.add('hidden'));
controls.addEventListener('unlock', () => overlay.classList.remove('hidden'));

const keys = {};
addEventListener('keydown', e => { keys[e.code] = true; });
addEventListener('keyup',   e => { keys[e.code] = false; });

const velocity = new THREE.Vector3();
let onGround = true;
const SPEED = 7, SPRINT = 1.6, JUMP = 6, GRAVITY = 18;

function collide(pos) {
  const lim = ARENA - 0.5 - RADIUS;
  pos.x = THREE.MathUtils.clamp(pos.x, -lim, lim);
  pos.z = THREE.MathUtils.clamp(pos.z, -lim, lim);
  for (const o of obstacles) {
    const cx = THREE.MathUtils.clamp(pos.x, o.minX, o.maxX);
    const cz = THREE.MathUtils.clamp(pos.z, o.minZ, o.maxZ);
    const dx = pos.x - cx, dz = pos.z - cz;
    const d = Math.hypot(dx, dz);
    if (d < RADIUS && d > 0) { pos.x = cx + dx / d * RADIUS; pos.z = cz + dz / d * RADIUS; }
  }
}

function updatePlayer(dt) {
  const fwd = (keys.KeyW ? 1 : 0) - (keys.KeyS ? 1 : 0);
  const side = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0);
  const speed = SPEED * (keys.ShiftLeft ? SPRINT : 1);
  const len = Math.hypot(fwd, side) || 1;
  controls.moveForward(fwd / len * speed * dt);
  controls.moveRight(side / len * speed * dt);

  if (keys.Space && onGround) { velocity.y = JUMP; onGround = false; }
  velocity.y -= GRAVITY * dt;
  camera.position.y += velocity.y * dt;
  if (camera.position.y <= EYE) { camera.position.y = EYE; velocity.y = 0; onGround = true; }

  collide(camera.position);
}

// ---------- Sound (synthesized with Web Audio, no files) ----------
const sfx = (() => {
  let ctx = null, master = null, noiseBuf = null, muted = false;

  function init() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
    ctx = new AudioContext();
    master = ctx.createGain();
    master.gain.value = 0.5;
    master.connect(ctx.destination);
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }

  // Volume + stereo pan for a world position relative to the player
  const rel = new THREE.Vector3(), right = new THREE.Vector3();
  function spatial(pos) {
    if (!pos) return { vol: 1, pan: 0 };
    rel.copy(pos).sub(camera.position);
    const dist = rel.length();
    right.set(1, 0, 0).applyQuaternion(camera.quaternion);
    return { vol: 1 / (1 + dist * 0.12), pan: THREE.MathUtils.clamp(rel.normalize().dot(right), -1, 1) * 0.8 };
  }

  // Output chain for one sound: gain envelope -> panner -> master
  function out(vol, pan, t, attack, decay) {
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(vol, 0.0002), t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + attack + decay);
    const p = ctx.createStereoPanner();
    p.pan.value = pan;
    g.connect(p).connect(master);
    return g;
  }

  function noise(t, dur, vol, pan, filterType, freq, freqEnd) {
    const src = ctx.createBufferSource();
    src.buffer = noiseBuf;
    const f = ctx.createBiquadFilter();
    f.type = filterType;
    f.frequency.setValueAtTime(freq, t);
    if (freqEnd) f.frequency.exponentialRampToValueAtTime(freqEnd, t + dur);
    src.connect(f).connect(out(vol, pan, t, 0.003, dur));
    src.start(t, Math.random() * 0.5); src.stop(t + dur + 0.05);
  }

  function tone(t, dur, vol, pan, type, f0, f1, attack = 0.005) {
    const o = ctx.createOscillator();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + attack + dur);
    o.connect(out(vol, pan, t, attack, dur));
    o.start(t); o.stop(t + attack + dur + 0.05);
  }

  const play = fn => (...args) => { if (ctx && !muted) fn(ctx.currentTime, ...args); };

  return {
    init,
    toggleMute() { muted = !muted; return muted; },
    shot: play(t => {
      noise(t, 0.12, 0.6, 0, 'lowpass', 4000, 300);      // crack
      tone(t, 0.1, 0.5, 0, 'sine', 140, 45);               // thump
    }),
    reload: play(t => {
      noise(t, 0.04, 0.3, 0.2, 'bandpass', 2500);           // mag out
      noise(t + 0.9, 0.05, 0.4, 0.2, 'bandpass', 1800);     // mag in
      noise(t + 1.15, 0.03, 0.4, 0.2, 'highpass', 3000);    // charge
    }),
    squish: play((t, pos) => {
      const s = spatial(pos);
      noise(t, 0.08, 0.5 * s.vol, s.pan, 'bandpass', 900, 300);
    }),
    croak: play((t, pos, pitch = 1) => {
      // Two ribbit pulses with a falling pitch and a nasal bandpass
      const s = spatial(pos);
      for (const dt of [0, 0.13]) {
        const o = ctx.createOscillator();
        o.type = 'sawtooth';
        o.frequency.setValueAtTime(220 * pitch, t + dt);
        o.frequency.exponentialRampToValueAtTime(110 * pitch, t + dt + 0.1);
        const f = ctx.createBiquadFilter();
        f.type = 'bandpass'; f.frequency.value = 700 * pitch; f.Q.value = 3;
        o.connect(f).connect(out(0.35 * s.vol, s.pan, t + dt, 0.01, 0.1));
        o.start(t + dt); o.stop(t + dt + 0.15);
      }
    }),
    death: play((t, pos) => {
      // Long gurgling croak sliding down + wet splat
      const s = spatial(pos);
      tone(t, 0.5, 0.35 * s.vol, s.pan, 'sawtooth', 180, 40, 0.01);
      tone(t, 0.5, 0.2 * s.vol, s.pan, 'square', 12, 6, 0.01);
      noise(t, 0.25, 0.5 * s.vol, s.pan, 'lowpass', 1200, 200);
    }),
    spit: play((t, pos) => {
      // Wet "ptoo": rising filtered noise + short pop
      const s = spatial(pos);
      noise(t, 0.18, 0.5 * s.vol, s.pan, 'bandpass', 400, 2200);
      tone(t, 0.08, 0.3 * s.vol, s.pan, 'sine', 500, 900);
    }),
    bite: play((t, pos) => {
      const s = spatial(pos);
      noise(t, 0.06, 0.6 * s.vol, s.pan, 'highpass', 1500);
      tone(t, 0.08, 0.3 * s.vol, s.pan, 'square', 300, 120);
    }),
    hurt: play(t => {
      tone(t, 0.25, 0.5, 0, 'sine', 90, 40);
      noise(t, 0.15, 0.3, 0, 'lowpass', 600);
    }),
    waveStart: play(t => {
      tone(t, 0.6, 0.25, 0, 'sawtooth', 110, 220, 0.2);
      tone(t, 0.6, 0.2, 0, 'sawtooth', 165, 330, 0.2);
    }),
    waveClear: play(t => {
      [262, 330, 392, 523].forEach((f, i) => tone(t + i * 0.09, 0.25, 0.2, 0, 'triangle', f));
    }),
    gameOver: play(t => {
      [392, 330, 262, 196].forEach((f, i) => tone(t + i * 0.22, 0.4, 0.25, 0, 'sawtooth', f, f * 0.97));
    }),
  };
})();
addEventListener('keydown', e => { if (e.code === 'KeyM') sfx.toggleMute(); });
// ---------- Gun ----------
// Simple blocky rifle attached to the camera so it stays in view.
const gun = new THREE.Group();
const gunMetal = new THREE.MeshStandardMaterial({ color: 0x2b2f2a, roughness: 0.5, metalness: 0.6 });
const gunGrip  = new THREE.MeshStandardMaterial({ color: 0x5a4028, roughness: 0.9 });
const body   = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.12, 0.55), gunMetal);
const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.35, 10), gunMetal);
barrel.rotation.x = Math.PI / 2; barrel.position.set(0, 0.02, -0.42);
const grip   = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.16, 0.08), gunGrip);
grip.position.set(0, -0.12, 0.12); grip.rotation.x = 0.3;
const mag    = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.16, 0.08), gunMetal);
mag.position.set(0, -0.12, -0.08);
gun.add(body, barrel, grip, mag);
const GUN_REST = new THREE.Vector3(0.22, -0.2, -0.45);
gun.position.copy(GUN_REST);
camera.add(gun);

// Muzzle flash: a bright sprite-like mesh + point light, shown for a few ms per shot.
const flash = new THREE.Mesh(
  new THREE.SphereGeometry(0.07, 8, 8),
  new THREE.MeshBasicMaterial({ color: 0xffe08a })
);
flash.position.set(0, 0.02, -0.62);
flash.visible = false;
gun.add(flash);
const flashLight = new THREE.PointLight(0xffd070, 0, 8);
flashLight.position.copy(flash.position);
gun.add(flashLight);

// ---------- Shooting ----------
const MAG_SIZE = 30, FIRE_INTERVAL = 0.1, RELOAD_TIME = 1.4, DAMAGE = 25, RANGE = 100;
let ammo = MAG_SIZE, fireCooldown = 0, reloadTimer = 0, flashTimer = 0, recoil = 0;
let mouseDown = false;
const ammoEl = document.getElementById('ammo');
const raycaster = new THREE.Raycaster();
raycaster.far = RANGE;
const CENTER = new THREE.Vector2(0, 0);

// Anything that bullets can hit. Frogs (step 3) will register here with onHit().
const shootables = [];
scene.traverse(o => {
  let inCamera = false;
  for (let p = o; p; p = p.parent) if (p === camera) inCamera = true;
  if (o.isMesh && o !== ground && !inCamera) shootables.push(o);
});
shootables.push(ground);

addEventListener('mousedown', e => { if (e.button === 0 && controls.isLocked) mouseDown = true; }); // fallback mode sets mouseDown itself
addEventListener('mouseup',   e => { if (e.button === 0) mouseDown = false; });
controls.addEventListener('unlock', () => { mouseDown = false; });
addEventListener('keydown', e => { if (e.code === 'KeyR') startReload(); });

function startReload() {
  if (reloadTimer > 0 || ammo === MAG_SIZE) return;
  reloadTimer = RELOAD_TIME;
  sfx.reload();
  updateAmmo();
}

function updateAmmo() {
  ammoEl.textContent = reloadTimer > 0 ? 'RELOADING…' : `${ammo} / ${MAG_SIZE}`;
  ammoEl.classList.toggle('low', reloadTimer <= 0 && ammo <= 5);
}

// Impact puffs that fade out
const impacts = [];
const impactGeo = new THREE.SphereGeometry(0.08, 6, 6);
function spawnImpact(point, color) {
  const m = new THREE.Mesh(impactGeo, new THREE.MeshBasicMaterial({ color, transparent: true }));
  m.position.copy(point);
  scene.add(m);
  impacts.push({ mesh: m, life: 0.4 });
}

// ---------- Particles: flying goo/dust droplets + goo splats on the ground ----------
const particles = [], splats = [];
const MAX_PARTICLES = 400, MAX_SPLATS = 80, SPLAT_LIFE = 14, SPLAT_FADE = 4;
const dropGeo = new THREE.IcosahedronGeometry(0.05, 0);
const splatGeo = new THREE.CircleGeometry(1, 14);
const gooMat  = new THREE.MeshStandardMaterial({ color: 0x86e62c, emissive: 0x2f7008, roughness: 0.3 });
const dustMat = new THREE.MeshStandardMaterial({ color: 0x9a8a68, roughness: 1 });
const tmpDir = new THREE.Vector3();

// Spray `count` droplets from `pos`. `dir` (optional) biases the spray direction.
function burst(pos, count, kind, speed, dir = null) {
  for (let i = 0; i < count && particles.length < MAX_PARTICLES; i++) {
    const mesh = new THREE.Mesh(dropGeo, kind === 'goo' ? gooMat : dustMat);
    mesh.position.copy(pos);
    const size = 0.6 + Math.random() * 1.2;
    mesh.scale.setScalar(size);
    tmpDir.set(Math.random() - 0.5, Math.random() * 0.8 + 0.2, Math.random() - 0.5).normalize();
    if (dir) tmpDir.addScaledVector(dir, 1.2).normalize();
    scene.add(mesh);
    particles.push({ mesh, vel: tmpDir.clone().multiplyScalar(speed * (0.5 + Math.random())), life: 0.6 + Math.random() * 0.8, size, kind });
  }
}

// Irregular goo puddle on the ground: a few overlapping blobs sharing one fading material
function splat(x, z, radius) {
  const mat = new THREE.MeshStandardMaterial({ color: 0x5fae1c, emissive: 0x1a4a04, roughness: 0.25, transparent: true, opacity: 0.9, depthWrite: false });
  const g = new THREE.Group();
  const blobs = 2 + Math.floor(radius * 4);
  for (let i = 0; i < blobs; i++) {
    const b = new THREE.Mesh(splatGeo, mat);
    b.rotation.x = -Math.PI / 2;
    const r = radius * (0.35 + Math.random() * 0.6);
    b.scale.set(r, r * (0.6 + Math.random() * 0.4), 1);
    b.rotation.z = Math.random() * Math.PI;
    b.position.set((Math.random() - 0.5) * radius, 0, (Math.random() - 0.5) * radius);
    g.add(b);
  }
  g.position.set(x, 0.02 + splats.length * 0.0002, z); // tiny offsets avoid z-fighting
  scene.add(g);
  splats.push({ g, mat, age: 0 });
  if (splats.length > MAX_SPLATS) removeSplat(0);
}

function removeSplat(i) {
  const s = splats[i];
  scene.remove(s.g); s.mat.dispose();
  splats.splice(i, 1);
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i], m = p.mesh;
    p.vel.y -= 15 * dt;
    m.position.addScaledVector(p.vel, dt);
    m.rotation.x += dt * 8;
    p.life -= dt;
    let dead = p.life <= 0;
    if (m.position.y <= 0.03) {
      dead = true;
      if (p.kind === 'goo' && Math.random() < 0.35) splat(m.position.x, m.position.z, 0.12 + p.size * 0.08);
    }
    if (dead) { scene.remove(m); particles.splice(i, 1); }
    else if (p.life < 0.25) m.scale.setScalar(p.size * p.life / 0.25);
  }
  for (let i = splats.length - 1; i >= 0; i--) {
    const s = splats[i];
    s.age += dt;
    if (s.age > SPLAT_LIFE - SPLAT_FADE) s.mat.opacity = 0.9 * Math.max(0, (SPLAT_LIFE - s.age) / SPLAT_FADE);
    if (s.age >= SPLAT_LIFE) removeSplat(i);
  }
}

function clearParticles() {
  for (const p of particles) scene.remove(p.mesh);
  particles.length = 0;
  while (splats.length) removeSplat(0);
}

function shoot() {
  ammo--;
  fireCooldown = FIRE_INTERVAL;
  flashTimer = 0.04;
  recoil = 1;
  updateAmmo();
  sfx.shot();

  raycaster.setFromCamera(CENTER, camera);
  const hit = raycaster.intersectObjects(shootables, true)[0];
  if (hit) {
    // Walk up to find an object with an onHit handler (frogs, later).
    let o = hit.object;
    while (o && !o.userData.onHit) o = o.parent;
    if (o) {
      burst(hit.point, 7, 'goo', 4, raycaster.ray.direction); // goo sprays out the far side
      o.userData.onHit(DAMAGE, hit);
    } else {
      const normal = hit.face.normal.clone().transformDirection(hit.object.matrixWorld);
      burst(hit.point.clone().addScaledVector(normal, 0.05), 4, 'dust', 3, normal);
      spawnImpact(hit.point, 0xc8b890);
    }
  }
  if (ammo === 0) startReload();
}

function updateGun(dt) {
  fireCooldown -= dt;
  if (reloadTimer > 0) {
    reloadTimer -= dt;
    if (reloadTimer <= 0) { ammo = MAG_SIZE; reloadTimer = 0; updateAmmo(); }
  } else if (mouseDown && fireCooldown <= 0 && ammo > 0) {
    shoot();
  }

  flashTimer -= dt;
  flash.visible = flashTimer > 0;
  flash.rotation.z = Math.random() * Math.PI;
  flashLight.intensity = flashTimer > 0 ? 3 : 0;

  // Recoil kick + reload dip, eased back to rest
  recoil = Math.max(0, recoil - dt * 12);
  const dip = reloadTimer > 0 ? Math.sin((reloadTimer / RELOAD_TIME) * Math.PI) : 0;
  gun.position.set(GUN_REST.x, GUN_REST.y - dip * 0.15, GUN_REST.z + recoil * 0.06);
  gun.rotation.x = recoil * 0.12 - dip * 0.6;

  for (let i = impacts.length - 1; i >= 0; i--) {
    const p = impacts[i];
    p.life -= dt;
    p.mesh.material.opacity = p.life / 0.4;
    p.mesh.scale.setScalar(1 + (0.4 - p.life) * 3);
    if (p.life <= 0) { scene.remove(p.mesh); p.mesh.material.dispose(); impacts.splice(i, 1); }
  }
}

// ---------- Zombie frogs ----------
const HOP_TIME = 0.45, HOP_DIST = 2.6, HOP_HEIGHT = 1.1, STOP_DIST = 1.6;
const frogs = [];

// Frog variants. speed/dmg are multipliers on the wave's base values; score multiplies the kill score.
const FROG_TYPES = {
  normal:  { name: 'Zombie-frog', hp: 100, scale: 1,    speed: 1,    dmg: 1,   score: 1, hop: 1,   skin: 0x6b7a45 },
  hopper:  { name: 'Hoppers',     hp: 50,  scale: 0.65, speed: 1.7,  dmg: 0.6, score: 1, hop: 1.3, skin: 0xa6b07a },
  bull:    { name: 'Bullfrogs',   hp: 300, scale: 1.6,  speed: 0.65, dmg: 2.2, score: 3, hop: 0.8, skin: 0x3e4628 },
  spitter: { name: 'Spitters',    hp: 80,  scale: 0.95, speed: 1,    dmg: 0.8, score: 2, hop: 1,   skin: 0x8a8a2a },
};
const SPIT_MIN = 8, SPIT_MAX = 14, SPIT_COOLDOWN = 2.6;

function buildFrogModel(type) {
  // Each frog gets its own skin material so hit-flashes don't affect other frogs.
  const skin   = new THREE.MeshStandardMaterial({ color: type.skin, roughness: 0.85, emissive: 0x000000 });
  const belly  = new THREE.MeshStandardMaterial({ color: 0x9a9a78, roughness: 0.9 });
  const rot    = new THREE.MeshStandardMaterial({ color: 0x2e3320, roughness: 1 });
  const flesh  = new THREE.MeshStandardMaterial({ color: 0x8a2f2f, roughness: 0.6 });
  const eyeMat = new THREE.MeshStandardMaterial({ color: 0xff3a1a, emissive: 0xff2200, emissiveIntensity: 2 });
  const pupil  = new THREE.MeshBasicMaterial({ color: 0x1a0505 });
  const tooth  = new THREE.MeshStandardMaterial({ color: 0xe8e0c0, roughness: 0.5 });
  const drool  = new THREE.MeshStandardMaterial({ color: 0x9cff3a, emissive: 0x4a9a10, transparent: true, opacity: 0.85 });

  const g = new THREE.Group();
  const add = (geo, mat, x, y, z, sx = 1, sy = 1, sz = 1) => {
    const m = new THREE.Mesh(geo, mat);
    m.position.set(x, y, z); m.scale.set(sx, sy, sz);
    m.castShadow = true; g.add(m); return m;
  };
  const sphere = new THREE.SphereGeometry(0.5, 14, 10);

  // Body and head face +Z (Object3D.lookAt points +Z at the target)
  add(sphere, skin,  0, 0.45, 0,     1.2, 0.8, 1.3);   // body
  add(sphere, belly, 0, 0.35, 0.15,  1.0, 0.55, 1.1);  // pale belly
  add(sphere, skin,  0, 0.62, 0.48,  1.1, 0.6, 0.8);   // head
  add(new THREE.BoxGeometry(0.75, 0.09, 0.08), pupil, 0, 0.5, 0.84); // gaping mouth
  const fang = new THREE.ConeGeometry(0.035, 0.1, 5);
  for (const x of [-0.27, -0.12, 0.05, 0.2]) add(fang, tooth, x, 0.5, 0.87).rotation.x = Math.PI; // jagged teeth
  add(new THREE.CylinderGeometry(0.025, 0.012, 0.22, 6), drool, 0.12, 0.36, 0.86);  // dripping goo

  // Bulging glowing eyes
  for (const s of [-1, 1]) {
    add(sphere, skin,   s * 0.24, 0.84, 0.5,  0.32, 0.32, 0.32);
    add(sphere, eyeMat, s * 0.24, 0.88, 0.58, 0.24, 0.24, 0.2);
    add(sphere, pupil,  s * 0.24, 0.88, 0.67, 0.04, 0.12, 0.03); // thin slit pupil
  }
  // Rotting patches, exposed flesh and a bone poking out
  add(sphere, rot,   0.35, 0.68, -0.15, 0.35, 0.18, 0.4);
  add(sphere, rot,  -0.25, 0.75, -0.3,  0.3, 0.15, 0.3);
  add(sphere, rot,  -0.38, 0.62, 0.45,  0.2, 0.15, 0.2);
  add(sphere, flesh, 0.45, 0.45, 0.2,   0.12, 0.25, 0.3);
  add(sphere, flesh, -0.1, 0.8, -0.1,   0.25, 0.08, 0.25);
  add(new THREE.CylinderGeometry(0.03, 0.03, 0.3, 6), tooth, 0.5, 0.55, 0.2).rotation.z = -1.0;

  // Legs: big bent back legs, thin front legs
  const leg = new THREE.BoxGeometry(1, 1, 1);
  for (const s of [-1, 1]) {
    add(leg, skin, s * 0.62, 0.3, -0.3,  0.25, 0.35, 0.7).rotation.x = -0.4;
    add(leg, skin, s * 0.7,  0.06, 0.05, 0.3, 0.08, 0.5);  // back foot
    add(leg, skin, s * 0.35, 0.18, 0.55, 0.1, 0.35, 0.1);  // front leg
    add(leg, skin, s * 0.38, 0.03, 0.65, 0.22, 0.05, 0.2); // front foot
  }

  // Variant extras
  if (type === FROG_TYPES.bull) {
    // Lumpy warts and two bone horns
    for (let i = 0; i < 7; i++) {
      const a = Math.random() * Math.PI * 2;
      add(sphere, rot, Math.cos(a) * 0.45, 0.6 + Math.random() * 0.2, Math.sin(a) * 0.45 - 0.1, 0.18, 0.12, 0.18);
    }
    for (const s of [-1, 1]) add(new THREE.ConeGeometry(0.05, 0.25, 6), tooth, s * 0.3, 1.0, 0.45).rotation.z = -s * 0.5;
  } else if (type === FROG_TYPES.spitter) {
    // Swollen, glowing acid throat sac
    const sac = new THREE.MeshStandardMaterial({ color: 0xd8ff40, emissive: 0x9acc00, emissiveIntensity: 0.9, transparent: true, opacity: 0.9 });
    add(sphere, sac, 0, 0.38, 0.7, 0.55, 0.45, 0.4);
  } else if (type === FROG_TYPES.hopper) {
    // Extra-long back legs
    for (const s of [-1, 1]) add(leg, skin, s * 0.55, 0.45, -0.55, 0.18, 0.5, 0.5).rotation.x = 0.6;
  }

  g.userData.skin = skin;
  return g;
}

const ATTACK_COOLDOWN = 1.2;

function spawnFrog(speed = 1, damage = 10, typeKey = 'normal') {
  const type = FROG_TYPES[typeKey];
  // Outer group is animated (hop squash, flip); inner model carries the variant size
  const mesh = new THREE.Group();
  const model = buildFrogModel(type);
  model.scale.setScalar(type.scale);
  mesh.add(model);
  mesh.userData.skin = model.userData.skin;
  // Spawn near a random arena edge, at least 15 m from the player
  let x, z;
  do {
    const angle = Math.random() * Math.PI * 2, r = ARENA - 3 - Math.random() * 4;
    x = Math.cos(angle) * r; z = Math.sin(angle) * r;
  } while (Math.hypot(x - camera.position.x, z - camera.position.z) < 15);
  mesh.position.set(x, 0, z);
  scene.add(mesh);

  const stopDist = STOP_DIST * Math.max(1, type.scale * 0.9);
  const frog = {
    mesh, type, hp: type.hp, dead: false, deadTime: 0,
    speed: speed * type.speed, damage: Math.round(damage * type.dmg),
    stopDist, attackRange: stopDist + 0.5, spitCd: 1 + Math.random() * 2,
    hopWait: 0.5 + Math.random() * 0.5, hopT: -1, attackCd: 0.5,
    from: new THREE.Vector3(), to: new THREE.Vector3(), hitFlash: 0,
    pitch: (0.8 + Math.random() * 0.5) / Math.sqrt(type.scale), // bigger frog, deeper croak
  };
  mesh.userData.onHit = (dmg, hit) => damageFrog(frog, dmg, hit);
  shootables.push(mesh);
  frogs.push(frog);
  return frog;
}

function damageFrog(frog, dmg, hit) {
  if (frog.dead) return;
  frog.hp -= dmg;
  frog.hitFlash = 0.1;
  // Small knockback away from the shot
  const push = hit.point.clone().sub(camera.position).setY(0).normalize().multiplyScalar(0.25 / frog.type.scale);
  frog.mesh.position.add(push);
  if (frog.hopT >= 0) { frog.from.add(push); frog.to.add(push); }
  if (frog.hp <= 0) killFrog(frog);
  else sfx.squish(frog.mesh.position);
}

function killFrog(frog) {
  frog.dead = true;
  frog.hopT = -1;
  onFrogKilled(frog);
  sfx.death(frog.mesh.position);
  frog.mesh.position.y = 0;
  shootables.splice(shootables.indexOf(frog.mesh), 1);
  frog.mesh.userData.skin.emissive.setHex(0x000000);
  // Goo explosion + a big puddle under the corpse
  const center = frog.mesh.position.clone().setY(0.5 * frog.type.scale);
  burst(center, Math.round(30 * frog.type.scale), 'goo', 6);
  splat(center.x, center.z, 1.1 * frog.type.scale);
}

const toPlayer = new THREE.Vector3();
function updateFrogs(dt) {
  for (let i = frogs.length - 1; i >= 0; i--) {
    const f = frogs[i], m = f.mesh;

    if (f.dead) {
      // Flip onto its back, then sink into the swamp and disappear
      f.deadTime += dt;
      m.rotation.z = Math.min(f.deadTime / 0.3, 1) * Math.PI;
      const s = f.type.scale; // lift so the flipped body rests on the ground
      m.position.y = f.deadTime < 0.3 ? Math.sin(f.deadTime / 0.3 * Math.PI) * 0.6 + 0.9 * s * (f.deadTime / 0.3)
                   : 0.9 * s - Math.max(0, f.deadTime - 1.5) * 0.8 * s;
      if (f.deadTime > 3.5) { scene.remove(m); frogs.splice(i, 1); }
      continue;
    }

    // Hit flash
    f.hitFlash -= dt;
    m.userData.skin.emissive.setHex(f.hitFlash > 0 ? 0xff3333 : 0x000000);

    toPlayer.copy(camera.position).sub(m.position).setY(0);
    const dist = toPlayer.length();

    f.attackCd -= dt;
    f.spitCd -= dt;

    if (f.hopT >= 0) {
      // Mid-hop: parabolic arc from -> to, with a squash/stretch
      f.hopT += dt * f.speed / HOP_TIME;
      const t = Math.min(f.hopT, 1);
      m.position.lerpVectors(f.from, f.to, t);
      m.position.y = Math.sin(t * Math.PI) * HOP_HEIGHT * f.type.hop;
      m.scale.set(1, 1 + Math.sin(t * Math.PI) * 0.25, 1);
      if (t >= 1) { f.hopT = -1; f.hopWait = (0.35 + Math.random() * 0.45) / f.speed; m.scale.set(1.15, 0.8, 1.15); }
    } else {
      m.scale.lerp(new THREE.Vector3(1, 1, 1), Math.min(1, dt * 8)); // recover from landing squash
      // Face the player while sitting
      m.lookAt(camera.position.x, m.position.y, camera.position.z);
      f.hopWait -= dt;
      // Occasional croak; each frog has its own voice pitch
      if (Math.random() < dt * 0.25) sfx.croak(m.position, f.pitch);
      const isSpitter = f.type === FROG_TYPES.spitter;
      if (dist < f.attackRange && camera.position.y < EYE + 1.2) {
        // Bite! Snap forward-stretch as a visual tell
        if (f.attackCd <= 0) {
          f.attackCd = ATTACK_COOLDOWN;
          m.scale.set(0.85, 1.35, 1.3);
          sfx.bite(m.position);
          damagePlayer(f.damage);
        }
      } else if (isSpitter && dist >= SPIT_MIN && dist <= SPIT_MAX + 3 && f.spitCd <= 0) {
        // Spitter in range: rear back and lob an acid blob
        f.spitCd = SPIT_COOLDOWN * (0.8 + Math.random() * 0.4);
        m.scale.set(1.25, 0.8, 1.3);
        spit(f);
      } else if (f.hopWait <= 0) {
        // Decide where to hop: melee frogs close in; spitters keep SPIT_MIN..SPIT_MAX distance and strafe
        let step = 0, sideAmt = 1.2;
        if (!isSpitter) step = dist > f.stopDist ? Math.min(HOP_DIST * f.type.hop, dist - f.stopDist + 0.2) : 0;
        else if (dist > SPIT_MAX) step = Math.min(HOP_DIST, dist - SPIT_MAX + 2);
        else if (dist < SPIT_MIN) step = -HOP_DIST;
        else sideAmt = 4;
        if (step !== 0 || isSpitter) {
          toPlayer.normalize();
          // Sideways jitter so the horde spreads out instead of stacking in a line
          const side = new THREE.Vector3(-toPlayer.z, 0, toPlayer.x).multiplyScalar((Math.random() - 0.5) * sideAmt);
          if (!isSpitter && dist <= 5) side.set(0, 0, 0);
          f.from.copy(m.position);
          f.to.copy(m.position).addScaledVector(toPlayer, step).add(side);
          const lim = ARENA - 1.5;
          f.to.x = THREE.MathUtils.clamp(f.to.x, -lim, lim);
          f.to.z = THREE.MathUtils.clamp(f.to.z, -lim, lim);
          f.hopT = 0;
        }
      }
    }
  }
}

// ---------- Acid spit projectiles ----------
const SPIT_G = 15, SPIT_SPEED = 14;
const spits = [];
const spitGeo = new THREE.SphereGeometry(0.16, 10, 8);
const spitMat = new THREE.MeshStandardMaterial({ color: 0xd8ff40, emissive: 0xa0d000, emissiveIntensity: 1.2 });

function spit(f) {
  const start = f.mesh.position.clone().setY(0.6 * f.type.scale);
  const target = camera.position.clone();
  target.y -= 0.5; // aim at the chest, where the player is *now* (so moving dodges it)
  start.addScaledVector(target.clone().sub(start).setY(0).normalize(), 0.7);
  const T = THREE.MathUtils.clamp(start.distanceTo(target) / SPIT_SPEED, 0.5, 1.2);
  const vel = new THREE.Vector3(
    (target.x - start.x) / T, (target.y - start.y + 0.5 * SPIT_G * T * T) / T, (target.z - start.z) / T);
  const mesh = new THREE.Mesh(spitGeo, spitMat);
  mesh.position.copy(start);
  scene.add(mesh);
  spits.push({ mesh, vel, damage: f.damage });
  sfx.spit(start);
}

function splashSpit(i, pos) {
  burst(pos, 8, 'goo', 3);
  splat(pos.x, pos.z, 0.45);
  scene.remove(spits[i].mesh);
  spits.splice(i, 1);
}

function updateSpits(dt) {
  for (let i = spits.length - 1; i >= 0; i--) {
    const s = spits[i], p = s.mesh.position;
    s.vel.y -= SPIT_G * dt;
    p.addScaledVector(s.vel, dt);
    if (Math.random() < dt * 20) burst(p, 1, 'goo', 0.5); // dripping trail

    // Hit the player? Treat the player as a vertical capsule from feet to eyes.
    const cy = THREE.MathUtils.clamp(p.y, camera.position.y - EYE + 0.2, camera.position.y);
    if (Math.hypot(p.x - camera.position.x, p.y - cy, p.z - camera.position.z) < 0.6) {
      damagePlayer(s.damage);
      splashSpit(i, p.clone().setY(0.05));
      continue;
    }
    // Crates block spit (crates are cubes, so height = width)
    const blocked = obstacles.some(o => p.x > o.minX && p.x < o.maxX && p.z > o.minZ && p.z < o.maxZ && p.y < o.maxX - o.minX);
    if (blocked || p.y <= 0.05 || Math.abs(p.x) > ARENA || Math.abs(p.z) > ARENA) splashSpit(i, p.clone().setY(0.05));
  }
}

function clearSpits() {
  for (const s of spits) scene.remove(s.mesh);
  spits.length = 0;
}

// ---------- Game state: health, score, waves ----------
const $ = id => document.getElementById(id);
const MAX_HP = 100, BREAK_TIME = 3, WAVE_HEAL = 20;
let hp = MAX_HP, score = 0, gameOver = false, started = false, hurt = 0;
const wave = { n: 0, toSpawn: 0, spawnTimer: 0, breakTimer: 0, inBreak: true, speed: 1, damage: 10, interval: 1, maxAlive: 12 };

function aliveFrogs() { return frogs.reduce((c, f) => c + (f.dead ? 0 : 1), 0); }

function updateHud() {
  $('hp').textContent = Math.ceil(hp);
  $('health-fill').style.width = `${hp / MAX_HP * 100}%`;
  $('health-fill').classList.toggle('low', hp <= 30);
  $('wave').textContent = wave.n;
  $('score').textContent = score;
  $('left').textContent = wave.toSpawn + aliveFrogs();
}

let bannerTimer = 0;
function showBanner(html, seconds = 2.5) {
  $('banner').innerHTML = html;
  $('banner').classList.add('show');
  bannerTimer = seconds;
}

function startWave(n) {
  // Difficulty curve: more, faster, harder-biting frogs each wave
  wave.n = n;
  wave.toSpawn  = 5 + (n - 1) * 3;
  wave.speed    = Math.min(1 + (n - 1) * 0.08, 2);
  wave.damage   = Math.min(8 + n * 2, 25);
  wave.interval = Math.max(0.25, 1.2 - n * 0.08);
  wave.maxAlive = Math.min(12 + n * 2, 30);
  wave.inBreak = true;
  wave.breakTimer = BREAK_TIME;
  showBanner(`WAVE ${n}<small>${wave.toSpawn} zombie-frogs incoming${newTypeNote(n)}</small>`, BREAK_TIME);
  updateHud();
}

// Variant mix per wave: each type unlocks at a wave and gets more common, up to a cap
const VARIANT_MIX = [
  { key: 'hopper',  from: 3, base: 0.15, grow: 0.04, max: 0.30 },
  { key: 'bull',    from: 4, base: 0.08, grow: 0.03, max: 0.18 },
  { key: 'spitter', from: 5, base: 0.10, grow: 0.03, max: 0.20 },
];
function pickFrogType(n) {
  let r = Math.random();
  for (const v of VARIANT_MIX) {
    if (n < v.from) continue;
    const p = Math.min(v.base + (n - v.from) * v.grow, v.max);
    if (r < p) return v.key;
    r -= p;
  }
  return 'normal';
}
function newTypeNote(n) {
  const v = VARIANT_MIX.find(v => v.from === n);
  return v ? `<br>⚠ NEW: ${FROG_TYPES[v.key].name}` : '';
}

function updateWaves(dt) {
  if (bannerTimer > 0 && (bannerTimer -= dt) <= 0) $('banner').classList.remove('show');

  if (wave.inBreak) {
    if ((wave.breakTimer -= dt) <= 0) { wave.inBreak = false; wave.spawnTimer = 0; sfx.waveStart(); }
    return;
  }
  wave.spawnTimer -= dt;
  if (wave.toSpawn > 0 && wave.spawnTimer <= 0 && aliveFrogs() < wave.maxAlive) {
    spawnFrog(wave.speed * (0.85 + Math.random() * 0.3), wave.damage, pickFrogType(wave.n));
    wave.toSpawn--;
    wave.spawnTimer = wave.interval;
    updateHud();
  }
  if (wave.toSpawn === 0 && aliveFrogs() === 0) {
    hp = Math.min(MAX_HP, hp + WAVE_HEAL);
    sfx.waveClear();
    startWave(wave.n + 1);
    showBanner(`WAVE ${wave.n - 1} CLEARED<small>+${WAVE_HEAL} health · wave ${wave.n} in ${BREAK_TIME}s${newTypeNote(wave.n)}</small>`, BREAK_TIME);
  }
}

function onFrogKilled(frog) {
  score += 10 * wave.n * frog.type.score;
  updateHud();
}

function damagePlayer(dmg) {
  if (gameOver) return;
  hp = Math.max(0, hp - dmg);
  hurt = 1;
  sfx.hurt();
  updateHud();
  if (hp <= 0) endGame();
}

function endGame() {
  gameOver = true;
  mouseDown = false;
  $('title').textContent = 'CROAKED';
  $('subtitle').textContent = `You reached wave ${wave.n} with ${score} points · Click to play again`;
  sfx.gameOver();
  if (fallback) { fallbackPlaying = false; dragging = false; overlay.classList.remove('hidden'); }
  else controls.unlock();
}

function resetGame() {
  for (const f of frogs) {
    scene.remove(f.mesh);
    const idx = shootables.indexOf(f.mesh);
    if (idx >= 0) shootables.splice(idx, 1);
  }
  frogs.length = 0;
  clearParticles();
  clearSpits();
  hp = MAX_HP; score = 0; gameOver = false; hurt = 0;
  ammo = MAG_SIZE; reloadTimer = 0; updateAmmo();
  camera.position.set(0, EYE, 0); velocity.set(0, 0, 0);
  $('title').textContent = 'FROG HORDE';
  startWave(1);
}

// ---------- Drag-to-look fallback ----------
// Inside embedded frames (e.g. a Microsoft Teams tab) pointer lock can be blocked.
// Then: drag with any mouse button to look; holding the left button also shoots.
let fallback = false, fallbackPlaying = false, lockWorked = false, dragging = false, lastX = 0, lastY = 0;
const DRAG_SENS = 0.004;
const isPlaying = () => controls.isLocked || (fallback && fallbackPlaying);
const lookEuler = new THREE.Euler(0, 0, 0, 'YXZ');
const canvas = renderer.domElement;

controls.addEventListener('lock', () => { lockWorked = true; });

function enterFallback() {
  if (fallback || lockWorked) return;
  fallback = true;
  fallbackPlaying = true;
  overlay.classList.add('hidden');
  $('controls-hint').textContent = 'WASD move · Drag mouse to look · Space jump · Shift sprint · Esc pause';
  $('hint').classList.add('show');
  setTimeout(() => $('hint').classList.remove('show'), 6000);
}
document.addEventListener('pointerlockerror', () => enterFallback());

function requestLock() {
  try {
    const p = document.body.requestPointerLock();
    if (p && p.catch) p.catch(() => enterFallback());
  } catch { enterFallback(); }
}

canvas.addEventListener('pointerdown', e => {
  if (!fallback || !fallbackPlaying) return;
  dragging = true; lastX = e.clientX; lastY = e.clientY;
  canvas.setPointerCapture(e.pointerId); // keep receiving moves even if the cursor leaves the frame
  if (e.button === 0) mouseDown = true;
});
canvas.addEventListener('pointermove', e => {
  if (!dragging) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  lookEuler.setFromQuaternion(camera.quaternion);
  lookEuler.y -= dx * DRAG_SENS;
  lookEuler.x = THREE.MathUtils.clamp(lookEuler.x - dy * DRAG_SENS, -Math.PI / 2 + 0.01, Math.PI / 2 - 0.01);
  camera.quaternion.setFromEuler(lookEuler);
});
canvas.addEventListener('pointerup', e => {
  if (e.button === 0) mouseDown = false;
  if (e.buttons === 0) dragging = false;
});
canvas.addEventListener('contextmenu', e => e.preventDefault());
addEventListener('keydown', e => {
  if (e.code === 'Escape' && fallback && fallbackPlaying) {
    fallbackPlaying = false; dragging = false; mouseDown = false;
    if (!gameOver) $('subtitle').textContent = 'Paused · Click to resume';
    overlay.classList.remove('hidden');
  }
});

// Overlay: start / resume / restart
overlay.addEventListener('click', () => {
  sfx.init(); // audio may only start after a user gesture
  if (!started || gameOver) { started = true; resetGame(); }
  if (fallback) { fallbackPlaying = true; overlay.classList.add('hidden'); }
  else requestLock();
});
controls.addEventListener('unlock', () => {
  if (!gameOver) $('subtitle').textContent = 'Paused · Click to resume';
});

// ---------- Loop ----------
const clock = new THREE.Clock();
function loop() {
  const dt = Math.min(clock.getDelta(), 0.05);
  if (isPlaying() && !gameOver) {
    updatePlayer(dt); updateGun(dt); updateFrogs(dt); updateWaves(dt); updateSpits(dt); updateParticles(dt);
    hurt = Math.max(0, hurt - dt * 2.5);
    $('hurt').style.opacity = hurt;
  }
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
